const fade=Math.max(0,Math.min(1,p/.9,(du-p)/1.1)),maxW=w*(w<h?.86:.72);g.globalAlpha=fade;
const draw=(L,sp,y0,fn)=>L.forEach((ln,r)=>{const tw=ln.reduce((a,o)=>a+o.w,0)+sp*(ln.length-1);let x=(w-tw)/2;const y=y0+r*lh;for(const o of ln){fn(o,x,y);x+=o.w+sp;}});
if(PY.s==='karaoke'){const{L,sp}=lay(g,PY.ws,maxW),y0=h*.72-(L.length-1)*lh/2,dw=(du-3.5)/n;
draw(L,sp,y0,(o,x,y)=>{const q=Math.max(0,Math.min(1,(p-1-o.i*dw)/dw));g.lineWidth=fs*.17;g.strokeStyle='rgba(0,15,35,.72)';g.strokeText(o.x,x,y);g.fillStyle='rgba(255,255,255,.93)';g.fillText(o.x,x,y);

else if(PY.s==='subtitle'){const per=w<h?5:7,ch=Math.ceil(n/per),cd=(du-1.5)/ch,c=Math.max(0,Math.min(ch-1,Math.floor((p-.5)/cd))),lp=p-.5-c*cd,{L,sp}=lay(g,PY.ws.slice(c*per,(c+1)*per),maxW),a=Math.max(0,Math.min(1,lp/.35,(cd-lp)/.35)),bh=L.length*lh+fs*.7,y0=h*.84-bh/2+lh/2+(1-a)*fs*.5;
g.globalAlpha=fade*a;g.fillStyle='rgba(0,0,0,.5)';const bw=Math.max(...L.map(l=>l.reduce((s,o)=>s+o.w,0)+sp*(l.length-1)))+fs*1.2,bx=(w-bw)/2;g.beginPath();if(g.roundRect)g.roundRect(bx,y0-lh/2-fs*.35,bw,bh,fs*.4);else g.rect(bx,y0-lh/2-fs*.35,bw,bh);g.fill();
draw(L,sp,y0,(o,x,y)=>{g.lineWidth=fs*.1;g.strokeStyle='rgba(0,0,0,.6)';g.strokeText(o.x,x,y);g.fillStyle='#fff';g.fillText(o.x,x,y);});}
else{const{L,sp}=lay(g,PY.ws,maxW),y0=h*.42-(L.length-1)*lh/2,dw=(du-4)/n;
draw(L,sp,y0,(o,x,y)=>{const a=Math.max(0,Math.min(1,(p-.6-o.i*dw)/.6));if(a<=0)return;g.globalAlpha=fade*a;g.shadowColor='#ffcf6a';g.shadowBlur=fs*.7;g.lineWidth=fs*.1;g.strokeStyle='rgba(60,25,0,.55)';const yy=y+(1-a)*fs*.6;g.strokeText(o.x,x,yy);g.fillStyle='#fff6e0';g.fillText(o.x,x,yy);});}
g.restore();}
